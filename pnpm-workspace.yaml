catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# pwa(workbox-build@7.4.1)の推移的依存。正規の公開だが no-downgrade に掛かるので版を固定して除外する
trustPolicyExclude:
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
  - semver@6.3.1
blockExoticSubdeps: true
strictDepBuilds: true
# worker(wrangler)の依存。選ばなかったときも残るが実害はない
allowBuilds:
  esbuild: true
  workerd: true
savePrefix: ""
# テンプレートの features/ 由来の依存(setup で選ばれなかった feature の分は消える)
catalogs:
  tailwind:
    "@tailwindcss/vite": 4.3.3
    tailwindcss: 4.3.3
  pwa:
    vite-plugin-pwa: 1.3.0
  worker:
    wrangler: 4.135.0
  tanstack-router:
    "@tanstack/react-router": 1.170.38
    "@tanstack/router-plugin": 1.168.40
