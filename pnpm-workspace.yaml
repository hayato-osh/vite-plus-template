catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# worker の cf と @cloudflare/vite-plugin は beta で、公開から 7 日経たないうちに使う。依存も含めて版を固定して除外する
minimumReleaseAgeExclude:
  - cf@1.0.0-beta.5
  - "@cloudflare/vite-plugin@2.0.0-beta.sha-ad79608dd"
  - miniflare@5.20260926.0-alpha
  - workerd@1.20260926.1
  - "@cloudflare/build-output-utils@0.8.2"
  - "@cloudflare/codemods@0.2.1"
  - "@cloudflare/config@0.20.0"
  - "@cloudflare/runtime-types@0.1.4"
  - "@cloudflare/workerd-darwin-64@1.20260926.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260926.1"
  - "@cloudflare/workerd-linux-64@1.20260926.1"
  - "@cloudflare/workerd-linux-arm64@1.20260926.1"
  - "@cloudflare/workerd-windows-64@1.20260926.1"
# pwa(workbox-build@7.4.1)の推移的依存。正規の公開だが no-downgrade に掛かるので版を固定して除外する
trustPolicyExclude:
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
  - semver@6.3.1
blockExoticSubdeps: true
strictDepBuilds: true
# worker(workerd)の依存。選ばなかったときも残るが実害はない
allowBuilds:
  workerd: true
savePrefix: ""
# テンプレートの features/ 由来の依存(setup で選ばれなかった feature の分は消える)
catalogs:
  tailwind:
    "@tailwindcss/vite": 4.3.3
    tailwindcss: 4.3.3
  pwa:
    vite-plugin-pwa: 1.3.0
  worker:
    "@cloudflare/vite-plugin": 2.0.0-beta.sha-ad79608dd
    cf: 1.0.0-beta.5
  tanstack-router:
    "@tanstack/react-router": 1.170.38
    "@tanstack/router-plugin": 1.168.40
