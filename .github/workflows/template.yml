# テンプレートリポジトリ専用。features/ の各組み合わせで setup してから完了の定義を通す。
# setup がこのファイルを消すので、派生プロジェクトには残らない。
name: Template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        css: [modules, tailwind]
        pwa: [none, pwa]
        worker: [none, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          cache: true
      - run: vp run setup --css ${{ matrix.css }} --pwa ${{ matrix.pwa }} --worker ${{ matrix.worker }}
      # setup で依存が変わるので lockfile の更新を許す
      - run: vp install --no-frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp run build
